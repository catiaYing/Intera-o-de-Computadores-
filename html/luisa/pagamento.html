<!DOCTYPE html>
<html lang="pt">

<head>
    <!-- 支持葡萄牙语字符 -->
    <meta charset="UTF-8">

    <!-- 适应手机屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANDy - Pagamento</title>

    <!-- 公共 CSS：手机尺寸、字体、导航、摘要 -->
    <link rel="stylesheet" href="../../styles/luisa/comum.css">

    <!-- 当前页面专属 CSS：支付选择按钮 -->
    <link rel="stylesheet" href="../../styles/luisa/pagamento.css">
</head>

<body>

    <!-- 整个手机页面 -->
    <main class="pagina">

        <!-- ===== 1. 顶部导航 ===== -->
        <header class="cabecalho">

            <!-- 返回首页，整合时改成购票页面 -->
            <a href="../index.html" class="voltar" aria-label="Voltar">
                &larr;
            </a>

            <h1>Pagamento</h1>

        </header>


        <!-- ===== 2. 页面介绍 ===== -->
        <section class="introducao">

            <p class="etiqueta">FINALIZAR COMPRA</p>

            <h2>Está quase!</h2>

            <p class="descricao">
                Escolhe como queres pagar o teu bilhete.
            </p>

        </section>


        <!-- ===== 3. 购买摘要 ===== -->
        <section class="resumo">

            <p class="resumo-titulo">RESUMO DA COMPRA</p>

            <div class="festival">

                <!-- 临时图标，之后可以换成小组的图片 -->
                <div class="icone-festival">♫</div>

                <div>
                    <h3>Festival de Música</h3>
                    <p>Bilhete geral · 1 unidade</p>
                </div>

            </div>

            <hr>

            <div class="total">
                <span>Total</span>
                <strong>45,00 €</strong>
            </div>

        </section>


        <!-- ===== 4. 选择支付方式 ===== -->
        <section class="pagamentos">

            <h2>Como queres pagar?</h2>

            <!-- MB WAY -->
            <!-- data-metodo 让 JS 知道用户选择的方式 -->
            <button type="button" class="metodo"
                    data-metodo="mbway" aria-pressed="false">

                <span class="icone">MB</span>

                <span class="informacao">
                    <strong>MB WAY</strong>
                    <small>Pagamento com telemóvel</small>
                </span>

                <span class="circulo"></span>

            </button>


            <!-- Cartão -->
            <button type="button" class="metodo"
                    data-metodo="cartao" aria-pressed="false">

                <span class="icone">▤</span>

                <span class="informacao">
                    <strong>Cartão bancário</strong>
                    <small>Crédito ou débito</small>
                </span>

                <span class="circulo"></span>

            </button>


            <!-- PayPal -->
            <button type="button" class="metodo"
                    data-metodo="paypal" aria-pressed="false">

                <span class="icone">P</span>

                <span class="informacao">
                    <strong>PayPal</strong>
                    <small>Pagamento online</small>
                </span>

                <span class="circulo"></span>

            </button>

        </section>


        <!-- ===== 5. 继续按钮 ===== -->

        <!-- 没选支付方式前，按钮不能点击 -->
        <button type="button" id="continuar" disabled>
            Continuar
        </button>

        <!-- 用于显示 JS 提示 -->
        <p id="mensagem" role="status"></p>

    </main>


    <!-- 当前页面自己的 JS -->
    <script src="../../scripts/luisa/pagamento.js"></script>

</body>
</html>
