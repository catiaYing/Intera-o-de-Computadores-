<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil de Utilizador - BANDy</title>

    <link rel="stylesheet" href="../styles/rodrigo/comum.css">
    <link rel="stylesheet" href="../styles/rodrigo/perfil.css">
    <link rel="stylesheet" href="../styles/perfil_publico.css">
    <link rel="stylesheet" href="../styles/navbar.css">
</head>

<body>

<div class="telemovel">
<main class="pagina">

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <a href="javascript:history.back()" class="voltar" aria-label="Voltar">
            &larr;
        </a>
        <h1>Perfil</h1>
    </header>


    <!-- Informações do Perfil Público -->
    <section class="perfil-topo">

        <div class="avatar" id="avatar">--</div>

        <h2 id="nome-perfil">A carregar...</h2>

        <p class="utilizador" id="utilizador-perfil">@utilizador</p>

        <p class="distancia-perfil">A carregar distância...</p>

        <!-- Botões de Ação Dinâmicos (Preenchidos pelo JS) -->
        <div class="botoes-acao-perfil">
            <a href="#" id="btn-principal-perfil"></a>
            <a href="catia/chat.html" id="link-chat-direto" class="botao-chat-publico">
                💬 Chat
            </a>
        </div>

    </section>


    <!-- Estatísticas -->
    <section class="estatisticas">

        <div class="estatistica">
            <strong>4</strong>
            <span>Festivais</span>
        </div>

        <div class="estatistica">
            <strong>12</strong>
            <span>Amigos</span>
        </div>

        <div class="estatistica">
            <strong>3</strong>
            <span>Em comum</span>
        </div>

    </section>


    <!-- Informações Públicas / Gostos -->
    <nav class="menu">

        <div class="menu-item-publico">
            <strong>Sobre</strong>
            <span id="bio-perfil">
        </div>

        <div class="menu-item-publico">
            <strong>Artistas em Comum</strong>
            <span id="artistas-perfil">
        </div>

        <div class="menu-item-publico">
            <strong>Próximo Festival</strong>
            <span id="festival-perfil">
        </div>

    </nav>

</main>

    <!-- Navegação Inferior -->
    <nav class="bottom-nav">

        <a href="home.html" class="nav-item">
            <img src="../media/inicio-home.png" alt="">
            <span>Início</span>
        </a>

        <a href="rodrigo/pesquisar.html" class="nav-item">
            <img src="../media/pesquisar-search.png" alt="">
            <span>Pesquisar</span>
        </a>

        <a href="catia/bilhetes.html" class="nav-item">
            <img src="../media/bilhetes-ticket.png" alt="">
            <span>Bilhetes</span>
        </a>

        <a href="catia/contactos.html" class="nav-item active">
            <img src="../media/contactos-people.png" alt="">
            <span>Contactos</span>
        </a>

        <a href="rodrigo/perfil.html" class="nav-item">
            <img src="../media/perfil-user.png" alt="">
            <span>Perfil</span>
        </a>

    </nav>

</div>

<script src="../scripts/perfil_publico.js"></script>

</body>
</html>
