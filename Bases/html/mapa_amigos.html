<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANDy - Mapa do Amigo</title>

    <!-- Exatamente o mesmo CSS dos mapas da Luísa -->
    <link rel="stylesheet" href="../styles/luisa-mapa/mapa.css">
    <link rel="stylesheet" href="../styles/mapa_amigo.css">
</head>

<body>

<main class="pagina">

    <!-- Cabeçalho (igual ao mapa2d.html) -->
    <header class="topo">

        <a href="../html/amigos.html"
           aria-label="Voltar ao Encontrar">←</a>

        <div>
            <span class="subtitulo">BANDy · Navegação</span>
            <h1>Mapa 2D</h1>
        </div>

    </header>


    <!-- Festival selecionado -->
    <div class="cabecalho-mapa">

        <strong id="nome-festival">NOS Alive</strong>

        <span class="etiqueta">
            Recinto ilustrativo
        </span>

    </div>


    <!-- MAPA DO RECINTO (idêntico ao da Luísa com os 3 festivais) -->
    <section class="cartao-mapa">

        <div class="mapa-recinto alive"
             id="mapa-recinto"
             aria-label="Mapa ilustrativo do festival">

            <svg class="caminhos"
                 viewBox="0 0 100 100"
                 preserveAspectRatio="none"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- ========================= -->
                <!-- NOS ALIVE -->
                <!-- ========================= -->
                <g class="cenario cenario-alive">
                    <circle class="arvore" cx="8" cy="12" r="5"/>
                    <circle class="arvore" cx="91" cy="11" r="5"/>
                    <circle class="arvore" cx="12" cy="70" r="5"/>
                    <circle class="arvore" cx="89" cy="90" r="5"/>

                    <rect class="zona" x="59" y="79" width="28" height="10" rx="3"/>
                    <text class="texto-zona" x="73" y="85" text-anchor="middle">Descanso</text>
                </g>

                <g class="trilhos trilhos-alive">
                    <path d="
                        M 12 85 H 45
                        M 45 85 V 20
                        M 20 20 H 80
                        M 35 55 H 45
                        M 45 65 H 75
                    "/>
                </g>

                <g class="cenario cenario-alive">
                    <rect class="edificio" x="79" y="35" width="15" height="9" rx="2"/>
                    <text class="texto-edificio" x="86.5" y="40.7" text-anchor="middle">Bar</text>

                    <rect class="edificio" x="7" y="48" width="15" height="9" rx="2"/>
                    <text class="texto-edificio" x="14.5" y="53.7" text-anchor="middle">WC</text>

                    <rect class="edificio" x="75" y="70" width="19" height="9" rx="2"/>
                    <text class="texto-edificio" x="84.5" y="75.7" text-anchor="middle">Comida</text>
                </g>


                <!-- ========================= -->
                <!-- MEO KALORAMA -->
                <!-- ========================= -->
                <g class="cenario cenario-kalorama">
                    <circle class="arvore" cx="10" cy="12" r="7"/>
                    <circle class="arvore" cx="41" cy="12" r="6"/>
                    <circle class="arvore" cx="91" cy="36" r="6"/>
                    <circle class="arvore" cx="9" cy="87" r="6"/>
                    <circle class="arvore" cx="87" cy="91" r="5"/>

                    <rect class="zona" x="37" y="17" width="24" height="11" rx="3"/>
                    <text class="texto-zona" x="49" y="23.5" text-anchor="middle">Jardim</text>
                </g>

                <g class="trilhos trilhos-kalorama">
                    <path d="
                        M 50 90 V 52
                        M 20 52 H 75
                        M 20 30 V 52
                        M 25 52 V 65
                        M 75 18 V 70
                    "/>
                </g>

                <g class="cenario cenario-kalorama">
                    <rect class="edificio" x="55" y="34" width="17" height="9" rx="2"/>
                    <text class="texto-edificio" x="63.5" y="39.7" text-anchor="middle">Bar</text>

                    <rect class="edificio" x="6" y="68" width="15" height="9" rx="2"/>
                    <text class="texto-edificio" x="13.5" y="73.7" text-anchor="middle">WC</text>

                    <rect class="edificio" x="61" y="82" width="24" height="9" rx="2"/>
                    <text class="texto-edificio" x="73" y="87.7" text-anchor="middle">Comida</text>
                </g>


                <!-- ========================= -->
                <!-- PRIMAVERA SOUND -->
                <!-- ========================= -->
                <g class="cenario cenario-primavera">
                    <circle class="arvore" cx="9" cy="12" r="5"/>
                    <circle class="arvore" cx="86" cy="12" r="6"/>
                    <circle class="arvore" cx="11" cy="82" r="5"/>
                    <circle class="arvore" cx="91" cy="57" r="5"/>

                    <rect class="zona" x="8" y="86" width="26" height="9" rx="3"/>
                    <text class="texto-zona" x="21" y="91.5" text-anchor="middle">Descanso</text>
                </g>

                <g class="trilhos trilhos-primavera">
                    <path d="
                        M 85 85 H 45
                        M 45 90 V 20
                        M 18 65 H 45
                        M 45 20 H 70
                        M 25 25 H 45
                        M 45 60 H 65
                    "/>
                </g>

                <g class="cenario cenario-primavera">
                    <rect class="edificio" x="76" y="36" width="17" height="9" rx="2"/>
                    <text class="texto-edificio" x="84.5" y="41.7" text-anchor="middle">Bar</text>

                    <rect class="edificio" x="5" y="43" width="17" height="9" rx="2"/>
                    <text class="texto-edificio" x="13.5" y="48.7" text-anchor="middle">WC</text>

                    <rect class="edificio" x="51" y="90" width="24" height="8" rx="2"/>
                    <text class="texto-edificio" x="63" y="95.5" text-anchor="middle">Comida</text>
                </g>


                <!-- Percurso verde tracejado até ao amigo -->
                <polyline id="linha-rota"
                          class="rota"
                          points=""/>

            </svg>


            <!-- Palcos adicionados pelo JS -->
            <div id="marcadores"></div>


            <!-- Tua localização (ponto azul da Luísa) -->
            <span class="marcador origem"
                  id="origem"
                  title="A tua localização">
            </span>


            <!-- Entrada fixa -->
            <span class="marcador entrada"
                  id="local-entrada">
                Entrada
            </span>


            <!-- Localização do amigo (etiqueta amarela BANDy) -->
            <span class="marcador amigo-mapa"
                  id="ponto-amigo">
            </span>

        </div>


        <!-- Legenda (igual à da Luísa) -->
        <div class="legenda-mapa">

            <span>
                <i class="legenda-cor cor-tu"></i>
                Tu
            </span>

            <span>
                <i class="legenda-cor cor-rota"></i>
                Percurso
            </span>

            <span>
                <i class="legenda-cor cor-palco"></i>
                Palcos / Amigo
            </span>

        </div>

    </section>


    <!-- Destino (igual ao cartão destino-info da Luísa) -->
    <section class="destino-info">

        <div>
            <span class="titulo-pequeno">
                LOCALIZAÇÃO DO AMIGO
            </span>

            <strong id="destino-amigo-nome">
                Maria Costa · 45m
            </strong>
        </div>

        <span class="destino-icone">📍</span>

    </section>


    <!-- Instrução -->
    <p class="ajuda-mapa" id="detalhe-localizacao">
        Segue o percurso verde até à localização do teu amigo.
    </p>


    <!-- Ir para AR (igual ao mapa2d.html) -->
    <a href="../html/luisa-mapa/mapaAR.html"
       class="botao"
       id="ir-ar-amigo">
        Iniciar navegação AR →
    </a>

    <!-- Enviar mensagem -->
    <a href="../html/catia/chat.html"
       class="botao secundario"
       id="ir-chat-amigo">
        Enviar mensagem
    </a>

</main>

<script src="../scripts/mapa_amigo.js"></script>

</body>
</html>
