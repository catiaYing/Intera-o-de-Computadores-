<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANDy - Escolher bilhete</title>

    <!-- 公共样式 -->
    <link rel="stylesheet" href="../../styles/luisa/comum.css">

    <!-- 当前页面样式 -->
    <link rel="stylesheet" href="../../styles/luisa/escolher_bilhete.css">

    <!-- 当前页面的交互 -->
    <script src="../../scripts/luisa/escolher_bilhete.js" defer></script>
</head>

<body>

    <main class="pagina">

        <!-- 1. 顶部导航 -->
        <header class="cabecalho">

            <a href="../catia/bilhetes.html"
               class="voltar"
               aria-label="Voltar">
                &larr;
            </a>

            <h1>Escolher bilhete</h1>

        </header>


        <!-- 2. 音乐节信息 -->
        <section class="festival-info">

            <p>FESTIVAL</p>

            <h2 id="nomeFestival">MEO Alive</h2>

            <span>20 – 21 Junho 2027</span>

        </section>


        <!-- 3. 选择门票类型 -->
        <section class="escolha">

            <h2>Tipo de bilhete</h2>

            <!-- Passe Geral -->
            <button type="button"
                    class="tipo-bilhete selecionado"
                    data-tipo="Passe Geral"
                    data-preco="120">

                <span>
                    <strong>Passe Geral</strong>
                    <small>Acesso ao festival completo</small>
                </span>

                <strong>120,00 €</strong>

            </button>


            <!-- Bilhete Diário -->
            <button type="button"
                    class="tipo-bilhete"
                    data-tipo="Bilhete Diário"
                    data-preco="65">

                <span>
                    <strong>Bilhete Diário</strong>
                    <small>Acesso durante um dia</small>
                </span>

                <strong>65,00 €</strong>

            </button>

        </section>


        <!-- 4. 选择数量 -->
        <section class="quantidade">

            <h2>Quantidade</h2>

            <div class="contador">

                <button type="button" id="diminuir">−</button>

                <span id="numeroBilhetes">1</span>

                <button type="button" id="aumentar">+</button>

            </div>

        </section>


        <!-- 5. 总价 -->
        <section class="preco-total">

            <span>Total</span>

            <strong id="precoTotal">120,00 €</strong>

        </section>


        <!-- 6. 进入你的支付页面 -->
        <button type="button"
                id="continuarCompra"
                class="botao-principal">
            Continuar para pagamento
        </button>

    </main>

</body>
</html>
