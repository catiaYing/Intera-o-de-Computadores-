<!DOCTYPE html>
<html lang="pt">

<head>
    <!-- 支持葡萄牙语字符 -->
    <meta charset="UTF-8">

    <!-- 适应手机屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANDy - Pagamento</title>

    <!-- 所有支付页面共用的 CSS -->
    <link rel="stylesheet" href="../../styles/luisa/comum.css">

    <!-- 当前页面自己的 CSS -->
    <link rel="stylesheet" href="../../styles/luisa/pagamento.css">
</head>

<body>

    <!-- 整个手机页面 -->
    <main class="pagina">

        <!-- ===== 1. 顶部导航 ===== -->
        <header class="cabecalho">

            <!-- 返回选择门票页面 -->
            <a href="escolher_bilhete.html"
               class="voltar"
               aria-label="Voltar">
                &larr;
            </a>

            <h1>Pagamento</h1>

        </header>


        <!-- ===== 2. 页面介绍 ===== -->
        <section class="introducao">

            <p class="etiqueta">FINALIZAR COMPRA</p>

            <h2>Está quase!</h2>

            <p class="descricao">
                Escolhe como queres pagar o teu bilhete.
            </p>

        </section>


        <!-- ===== 3. 购买摘要 ===== -->
        <section class="resumo">

            <p class="resumo-titulo">
                RESUMO DA COMPRA
            </p>

            <!-- 音乐节和门票信息 -->
            <div class="festival">

                <div class="icone-festival">♫</div>

                <div>

                    <!--
                        compra.js 会根据用户选择，
                        自动更新音乐节名称
                    -->
                    <h3 id="festival-compra">
                        Festival de Música
                    </h3>

                    <!--
                        compra.js 自动更新：
                        门票类型 + 购买数量
                    -->
                    <p id="bilhete-compra">
                        Bilhete geral · 1 unidade
                    </p>

                </div>

            </div>

            <hr>

            <!-- 总金额由 compra.js 自动计算 -->
            <div class="total">

                <span>Total</span>

                <strong>—</strong>

            </div>

        </section>


        <!-- ===== 4. 选择支付方式 ===== -->
        <section class="pagamentos">

            <h2>Como queres pagar?</h2>


            <!-- MB WAY -->
            <button type="button"
                    class="metodo"
                    data-metodo="mbway"
                    aria-pressed="false">

                <span class="icone">MB</span>

                <span class="informacao">

                    <strong>MB WAY</strong>

                    <small>
                        Pagamento com telemóvel
                    </small>

                </span>

                <!-- 选择状态的圆圈 -->
                <span class="circulo"></span>

            </button>


            <!-- Cartão bancário -->
            <button type="button"
                    class="metodo"
                    data-metodo="cartao"
                    aria-pressed="false">

                <span class="icone">▤</span>

                <span class="informacao">

                    <strong>Cartão bancário</strong>

                    <small>
                        Crédito ou débito
                    </small>

                </span>

                <span class="circulo"></span>

            </button>


            <!-- PayPal -->
            <button type="button"
                    class="metodo"
                    data-metodo="paypal"
                    aria-pressed="false">

                <span class="icone">P</span>

                <span class="informacao">

                    <strong>PayPal</strong>

                    <small>
                        Pagamento online
                    </small>

                </span>

                <span class="circulo"></span>

            </button>

        </section>


        <!-- ===== 5. 继续按钮 ===== -->

        <!-- 没有选择支付方式时，按钮不可点击 -->
        <button type="button"
                id="continuar"
                disabled>
            Continuar
        </button>

        <!-- JavaScript 提示区域 -->
        <p id="mensagem" role="status"></p>

    </main>


    <!-- ===== 6. JavaScript ===== -->

    <!-- 选择支付方式、取消选择和页面跳转 -->
    <script src="../../scripts/luisa/pagamento.js"></script>

    <!-- 读取票种、数量，自动更新购买摘要和总金额 -->
    <script src="../../scripts/luisa/compra.js"></script>
    <script src="../../scripts/luisa/compra.js"></script>


</body>
</html>
