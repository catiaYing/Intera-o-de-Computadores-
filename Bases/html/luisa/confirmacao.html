<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BANDy - Confirmação</title>

    <!-- CSS da página -->
    <link rel="stylesheet"
          href="../../styles/luisa/confirmacao.css">

    <!-- JavaScript da página -->
    <script src="../../scripts/luisa/confirmacao.js"
            defer></script>
</head>

<body>

    <!-- Página principal -->
    <main class="pagina">

        <!-- ===== 1. CABEÇALHO ===== -->
        <header class="cabecalho">

            <!-- Voltar à lista de bilhetes -->
            <a href="../catia/bilhetes.html"
               class="voltar"
               aria-label="Voltar aos bilhetes">
                &#8592;
            </a>

            <h2>Confirmação</h2>

        </header>


        <!-- ===== 2. CONFIRMAÇÃO DO PAGAMENTO ===== -->
        <section class="resultado">

            <!-- Ícone de sucesso -->
            <div class="icone-sucesso">
                &#10003;
            </div>

            <h1>Pagamento Concluído!</h1>

            <p>
                O teu pagamento foi realizado com sucesso.
                O teu bilhete já está disponível!
            </p>

        </section>


        <!-- ===== 3. BOTÕES DE NAVEGAÇÃO ===== -->
        <section class="acoes">

            <!-- Ver o bilhete comprado -->
            <!-- Navegação controlada por confirmacao.js -->
            <button type="button"
                    id="verBilhete"
                    class="btn-principal">
                Ver o meu bilhete
            </button>


            <!-- Ver os festivais e bilhetes -->
            <!-- Navegação controlada por confirmacao.js -->
            <button type="button"
                    id="verFestivais"
                    class="btn-secundario">
                Ver os meus festivais
            </button>


            <!-- ===== VOLTAR AO INÍCIO ===== -->
            <!-- Voltar à página home.html -->
            <a href="../home.html"
               class="link-inicio">
                Voltar ao Início
            </a>

        </section>

    </main>

</body>
</html>
