
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contactos - BANDy</title>

    <link rel="stylesheet" href="../../styles/catia/contactos.css">
    <link rel="stylesheet" href="../../styles/navbar.css">

    <!-- Sistema de amigos removidos -->
    <script src="../../scripts/catia/perfil_users.js" defer></script>
</head>

<body>

    <main class="contacts-page">

        <!-- Cabeçalho -->
        <header class="contacts-header">
            <h1>Contactos</h1>

            <details class="add-menu">
                <summary class="add-button">+</summary>

                <div class="add-popup">

                    <a href="camera.html" class="popup-option">
                        <span>▦</span>
                        Ler QR Code
                    </a>

                    <a href="novos_amigos.html" class="popup-option">
                        <span>+</span>
                        Novos Amigos
                    </a>

                    <a href="../rodrigo/recomendacoes.html" class="popup-option">
                        <span>♫</span>
                        Recomendações
                    </a>

                    <a href="../pessoas_perto.html" class="popup-option">
                        <span>🌐︎</span>
                        Pessoas Perto
                    </a>

                </div>
            </details>
        </header>

        <!-- Pesquisa de contactos -->
        <section class="search-section">

            <form class="search-form">

                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    placeholder="Pesquisar contactos..."
                    aria-label="Pesquisar contactos"
                >

                <button type="button">
                    Pesquisar
                </button>

            </form>

        </section>

        <!-- Lista de contactos -->
        <section class="conversation-list">

            <!-- Maria -->
            <div class="conversation-row" data-user-id="maria">

                <a href="perfil_users.html?user=maria"
                    class="conversation">

                    <div class="avatar">M</div>

                    <div class="conversation-info">

                        <div class="conversation-top">
                            <h2>Maria</h2>
                            <span class="time" data-message-time></span>
                        </div>

                        <!-- A mensagem será carregada a partir do Chat -->
                        <p class="last-message" data-message-preview></p>

                    </div>
                </a>

                <a href="chat.html?user=maria"
                    class="chat-button"
                    aria-label="Abrir chat com Maria">
                    💬
                </a>

            </div>

            <!-- Filipe -->
            <div class="conversation-row" data-user-id="filipe">

                <a href="perfil_users.html?user=filipe"
                    class="conversation">

                    <div class="avatar">F</div>

                    <div class="conversation-info">

                        <div class="conversation-top">
                            <h2>Filipe</h2>
                            <span class="time" data-message-time></span>
                        </div>

                        <p class="last-message" data-message-preview></p>

                    </div>
                </a>

                <a href="chat.html?user=filipe"
                    class="chat-button"
                    aria-label="Abrir chat com Filipe">
                    💬
                </a>

            </div>

            <!-- Ana -->
            <div class="conversation-row" data-user-id="ana">

                <a href="perfil_users.html?user=ana"
                    class="conversation">

                    <div class="avatar">A</div>

                    <div class="conversation-info">

                        <div class="conversation-top">
                            <h2>Ana</h2>
                            <span class="time" data-message-time></span>
                        </div>

                        <p class="last-message" data-message-preview></p>

                    </div>
                </a>

                <a href="chat.html?user=ana"
                    class="chat-button"
                    aria-label="Abrir chat com Ana">
                    💬
                </a>

            </div>

            <!-- Santiago -->
            <div class="conversation-row" data-user-id="santiago">

                <a href="perfil_users.html?user=santiago"
                    class="conversation">

                    <div class="avatar">S</div>

                    <div class="conversation-info">

                        <div class="conversation-top">
                            <h2>Santiago</h2>
                            <span class="time" data-message-time></span>
                        </div>

                        <p class="last-message" data-message-preview></p>

                    </div>
                </a>

                <a href="chat.html?user=santiago"
                    class="chat-button"
                    aria-label="Abrir chat com Santiago">
                    💬
                </a>

            </div>

            <!-- Martim -->
            <div class="conversation-row" data-user-id="martim">

                <a href="perfil_users.html?user=martim"
                    class="conversation">

                    <div class="avatar">M</div>

                    <div class="conversation-info">

                        <div class="conversation-top">
                            <h2>Martim</h2>
                            <span class="time" data-message-time></span>
                        </div>

                        <p class="last-message" data-message-preview></p>

                    </div>
                </a>

                <a href="chat.html?user=martim"
                    class="chat-button"
                    aria-label="Abrir chat com Martim">
                    💬
                </a>

            </div>

        </section>

        <!-- Navegação inferior -->
        <nav class="bottom-nav">

            <a href="../home.html" class="nav-item">
                <span class="nav-icon">
                    <img src="../../media/inicio-home.png" alt="">
                </span>
                <span>Início</span>
            </a>

            <a href="../../html/rodrigo/pesquisar.html"
                class="nav-item">
                <span class="nav-icon">
                    <img src="../../media/pesquisar-search.png" alt="">
                </span>
                <span>Pesquisar</span>
            </a>

            <a href="../../html/catia/bilhetes.html"
                class="nav-item">
                <span class="nav-icon">
                    <img src="../../media/bilhetes-ticket.png" alt="">
                </span>
                <span>Bilhetes</span>
            </a>

            <a href="contactos.html"
                class="nav-item active">
                <span class="nav-icon">
                    <img src="../../media/contactos-people.png" alt="">
                </span>
                <span>Contactos</span>
            </a>

            <a href="../../html/rodrigo/perfil.html"
                class="nav-item">
                <span class="nav-icon">
                    <img src="../../media/perfil-user.png" alt="">
                </span>
                <span>Perfil</span>
            </a>

        </nav>

    </main>

    <!-- Pesquisa, remoção e mensagens -->
    <script src="../../scripts/catia/contactos.js" defer></script>

</body>
</html>
