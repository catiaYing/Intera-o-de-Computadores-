
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selecionar bilhete - BANDy</title>

    <link rel="stylesheet" href="../../styles/rodrigo/comum.css">
    <link rel="stylesheet" href="../../styles/rodrigo/selecionar_bilhete.css">
    <link rel="stylesheet" href="../../styles/navbar.css">
</head>

<body>

<div class="telemovel">

<main class="pagina">

    <!-- ===== 1. CABEÇALHO ===== -->

    <header class="cabecalho">

        <!-- Voltar à página Detalhes -->
        <a href="../detalhes.html?festival=MEO%20Alive"
           id="voltar-detalhes"
           class="voltar"
           aria-label="Voltar aos detalhes">
            &larr;
        </a>

        <h1>Selecionar bilhete</h1>

    </header>


    <!-- ===== 2. RESUMO DO FESTIVAL ===== -->

    <section class="festival-resumo">

        <div class="festival-icone">♫</div>

        <div>
            <h2 id="nome-festival">Festival</h2>
            <p id="info-festival"></p>
        </div>

    </section>


    <!-- ===== 3. TIPO DE BILHETE ===== -->

    <section class="secao">

        <p class="secao-titulo">TIPO DE BILHETE</p>

        <!-- Passe 1 dia -->
        <button type="button"
                class="opcao"
                data-tipo="Passe 1 dia"
                data-preco="45"
                aria-pressed="false">

            <span class="opcao-texto">
                <strong>Passe 1 dia</strong>
                <small>Acesso a um dia à escolha</small>
            </span>

            <span class="opcao-preco">45 €</span>
            <span class="opcao-circulo"></span>

        </button>


        <!-- Passe completo -->
        <button type="button"
                class="opcao"
                data-tipo="Passe completo"
                data-preco="120"
                aria-pressed="false">

            <span class="opcao-texto">
                <strong>Passe completo</strong>
                <small>Acesso a todos os dias do festival</small>
            </span>

            <span class="opcao-preco">120 €</span>
            <span class="opcao-circulo"></span>

        </button>


        <!-- Passe VIP -->
        <button type="button"
                class="opcao"
                data-tipo="Passe VIP"
                data-preco="190"
                aria-pressed="false">

            <span class="opcao-texto">
                <strong>Passe VIP</strong>
                <small>Acesso VIP e entrada prioritária</small>
            </span>

            <span class="opcao-preco">190 €</span>
            <span class="opcao-circulo"></span>

        </button>

    </section>


    <!-- ===== 4. QUANTIDADE ===== -->

    <section class="secao">

        <p class="secao-titulo">QUANTIDADE</p>

        <div class="quantidade">

            <span>Bilhetes</span>

            <div class="contador-quantidade">

                <button type="button"
                        id="diminuir"
                        aria-label="Diminuir quantidade">
                    &minus;
                </button>

                <output id="quantidade" aria-live="polite">1</output>

                <button type="button"
                        id="aumentar"
                        aria-label="Aumentar quantidade">
                    +
                </button>

            </div>

        </div>

    </section>


    <!-- ===== 5. TOTAL ===== -->

    <div class="total-linha">

        <span>Total</span>

        <strong id="total">0,00 €</strong>

    </div>


    <!-- ===== 6. CONTINUAR ===== -->

    <section class="rodape">

        <button type="button"
                class="botao-principal"
                id="continuar"
                disabled>
            Continuar
        </button>

        <p class="mensagem" id="mensagem" role="status"></p>

    </section>

</main>


<!-- ===== 7. NAVEGAÇÃO INFERIOR ===== -->

<nav class="bottom-nav">

    <a href="../home.html" class="nav-item">
        <img src="../../media/inicio-home.png" alt="">
        <span>Início</span>
    </a>

    <a href="pesquisar.html" class="nav-item active">
        <img src="../../media/pesquisar-search.png" alt="">
        <span>Pesquisar</span>
    </a>

    <a href="../catia/bilhetes.html" class="nav-item">
        <img src="../../media/bilhetes-ticket.png" alt="">
        <span>Bilhetes</span>
    </a>

    <a href="../catia/contactos.html" class="nav-item">
        <img src="../../media/contactos-people.png" alt="">
        <span>Contactos</span>
    </a>

    <a href="perfil.html" class="nav-item">
        <img src="../../media/perfil-user.png" alt="">
        <span>Perfil</span>
    </a>

</nav>

</div>


<!-- ===== 8. JAVASCRIPT ===== -->

<script src="../../scripts/rodrigo/selecionar_bilhete.js"></script>

</body>
</html>
