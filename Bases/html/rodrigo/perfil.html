        <h2>Editar perfil</h2>

        <div class="campo">
            <label for="campo-nome">Nome</label>
            <input type="text" id="campo-nome" maxlength="40">
        </div>

        <div class="campo">
            <label for="campo-utilizador">Nome de utilizador</label>
            <input type="text" id="campo-utilizador" maxlength="25">
        </div>

        <div class="modal-botoes">
            <button type="button" id="cancelar-edicao">Cancelar</button>
            <button type="submit" id="guardar-edicao">Guardar</button>
