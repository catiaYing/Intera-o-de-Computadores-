<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recomendações - BANDy</title>

    <link rel="stylesheet" href="../../styles/rodrigo/comum.css">
    <link rel="stylesheet" href="../../styles/rodrigo/recomendacoes.css">
    <link rel="stylesheet" href="../../styles/navbar.css">
</head>

<body>

<div class="telemovel">
<main class="pagina">

    <header class="cabecalho">
        <a href="../catia/contactos.html" class="voltar" aria-label="Voltar aos contactos">&larr;</a>
        <h1>Recomendações</h1>
    </header>

    <!-- Interesses compactos + botão adicionar -->
    <section class="interesses">
        <div class="interesses-topo">
            <h2>Os teus gostos</h2>
            <button type="button" class="botao-adicionar-gosto" id="abrir-modal-gosto">
                + Adicionar
            </button>
        </div>
        <div class="etiquetas etiquetas-compactas" id="meus-interesses"></div>
    </section>

    <!-- Pesquisa rápida -->
    <section class="pesquisa-recomendacoes">
        <input type="search"
               id="pesquisa-pessoas"
               placeholder="Pesquisar por nome, artista ou festival...">
    </section>

    <!-- Filtros -->
    <section class="filtros">
        <button type="button" class="filtro ativo" data-filtro="todos">Todos</button>
        <button type="button" class="filtro" data-filtro="artistas">Artistas</button>
        <button type="button" class="filtro" data-filtro="generos">Géneros</button>
        <button type="button" class="filtro" data-filtro="festivais">Festivais</button>
        <button type="button" class="filtro" data-filtro="sozinho">Vai sozinho(a)</button>
    </section>

    <p class="contador" id="contador"></p>

    <!-- Pessoas sugeridas -->
    <section class="lista-pessoas" id="lista-pessoas"></section>

    <p class="sem-resultados" id="sem-resultados" hidden>
        Não encontrámos sugestões para este filtro.
    </p>

</main>

    <nav class="bottom-nav">

        <a href="../home.html" class="nav-item">
            <img src="../../media/inicio-home.png" alt="">
            <span>Início</span>
        </a>

        <a href="pesquisar.html" class="nav-item">
            <img src="../../media/pesquisar-search.png" alt="">
            <span>Pesquisar</span>
        </a>

        <a href="../catia/bilhetes.html" class="nav-item">
            <img src="../../media/bilhetes-ticket.png" alt="">
            <span>Bilhetes</span>
        </a>

        <a href="../catia/contactos.html" class="nav-item active">
            <img src="../../media/contactos-people.png" alt="">
            <span>Contactos</span>
        </a>

        <a href="perfil.html" class="nav-item">
            <img src="../../media/perfil-user.png" alt="">
            <span>Perfil</span>
        </a>

    </nav>

    <!-- Modal para adicionar novos gostos -->
    <div class="modal" id="modal-gosto" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-gosto">
        <form class="modal-content" id="form-gosto">
            <h2 id="titulo-modal-gosto">Adicionar gosto</h2>

            <div class="campo">
                <label for="tipo-gosto">Categoria</label>
                <select id="tipo-gosto">
                    <option value="artistas">Artista</option>
                    <option value="generos">Género musical</option>
                    <option value="festivais">Festival</option>
                </select>
            </div>

            <div class="campo">
                <label for="nome-gosto">Nome</label>
                <input type="text"
                       id="nome-gosto"
                       placeholder="Ex.: Billie Eilish, Eletrónica, Primavera Sound..."
                       maxlength="30"
                       required>
            </div>

            <div class="modal-botoes">
                <button type="button" id="cancelar-gosto">Cancelar</button>
                <button type="submit" id="guardar-gosto">Adicionar</button>
            </div>
        </form>
    </div>

</div>

<script src="../../scripts/rodrigo/recomendacoes.js"></script>

</body>
</html>
