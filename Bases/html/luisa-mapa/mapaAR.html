<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BANDy - Navegação AR</title>

    <link rel="stylesheet"
          href="../../styles/luisa-mapa/mapa.css">

    <link rel="stylesheet"
          href="../../styles/luisa-mapa/mapaAR.css">
</head>

<body>

<main class="pagina">

    <header class="topo">

        <a id="voltar-2d"
           data-link="mapa2d.html"
           href="mapa2d.html"
           aria-label="Voltar">
            ←
        </a>

        <h1>Navegação AR</h1>
    </header>

    <p>
        <strong data-festival-nome></strong>
        ·
        <span data-ponto-nome></span>
    </p>

    <div class="vista-ar"
         id="vista-ar"
         hidden>

        <div class="ar-titulo">
            Destino:
            <strong id="destino-ar"></strong>
        </div>

        <div class="seta-ar" id="seta-ar">
            ↑
        </div>

        <div class="direcao-ar" id="direcao-ar">
            Segue em frente
        </div>

        <div class="ar-passo" id="progresso-ar">
            Passo 1
        </div>

    </div>

    <div class="acoes">

        <button class="botao"
                id="iniciar-ar"
                type="button">
            Iniciar simulação AR
        </button>

        <button class="botao"
                id="proximo-passo"
                type="button"
                hidden>
            Próximo passo →
        </button>

        <button class="botao secundario"
                id="cheguei"
                type="button"
                hidden>
            Cheguei!
        </button>

        <button class="botao secundario"
                id="reiniciar-ar"
                type="button">
            Reiniciar percurso
        </button>

        <a class="botao secundario"
           id="ir-2d"
           data-link="mapa2d.html"
           href="mapa2d.html">
            Voltar ao mapa 2D
        </a>

    </div>

    <p class="legenda">
        Navegação AR simulada.
        Não utiliza a câmara nem a localização real.
    </p>

</main>

<script src="../../scripts/luisa-mapa/mapa.js"></script>
<script src="../../scripts/luisa-mapa/mapaAR.js"></script>

</body>
</html>
