<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BANDy - Mapas e Navegação</title>

    <link rel="stylesheet"
          href="../../styles/luisa-mapa/mapa.css">
</head>

<body>

<main class="pagina">

    <header class="topo">
        <a href="../index.html" aria-label="Voltar">←</a>
        <h1>Mapas e Navegação</h1>
    </header>

    <p>
        Escolhe o festival e o ponto de encontro
        para consultar o percurso.
    </p>

    <label for="festival">Festival</label>

    <select id="festival">
        <option value="alive">NOS Alive</option>
        <option value="kalorama">MEO Kalorama</option>
        <option value="primavera">Primavera Sound</option>
    </select>

    <label for="ponto">Ponto de encontro</label>

    <select id="ponto">
        <option value="palco-x">Palco X</option>
        <option value="side-stage">Side Stage</option>
        <option value="palco-y">Palco Y</option>
        <option value="palco-z">Palco Z</option>
    </select>

    <a class="botao"
       id="abrir-2d"
       data-link="mapa2d.html"
       href="mapa2d.html">
        Ver mapa 2D
    </a>

    <a class="botao secundario"
       id="abrir-ar"
       data-link="mapaAR.html"
       href="mapaAR.html">
        Ver navegação AR
    </a>

    <p class="legenda">
        Protótipo ilustrativo.
        Não utiliza GPS nem câmara real.
    </p>

</main>

<script src="../../scripts/luisa-mapa/mapa.js"></script>
<script src="../../scripts/luisa-mapa/mapa-menu.js"></script>

</body>
</html>
