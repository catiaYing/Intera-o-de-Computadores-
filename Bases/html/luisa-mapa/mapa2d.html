<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BANDy - Mapa 2D</title>

    <link rel="stylesheet"
          href="../../styles/luisa-mapa/mapa.css">
</head>

<body>

<main class="pagina">

    <header class="topo">
        <a href="mapa.html" aria-label="Voltar">←</a>
        <h1>Mapa 2D</h1>
    </header>

    <p>
        Festival:
        <strong data-festival-nome></strong>
    </p>

    <label for="festival">Festival</label>

    <select id="festival">
        <option value="alive">NOS Alive</option>
        <option value="kalorama">MEO Kalorama</option>
        <option value="primavera">Primavera Sound</option>
    </select>

    <label for="ponto">Destino</label>

    <select id="ponto">
        <option value="palco-x">Palco X</option>
        <option value="side-stage">Side Stage</option>
        <option value="palco-y">Palco Y</option>
        <option value="palco-z">Palco Z</option>
        <option value="livre">Ponto personalizado</option>
    </select>

    <div class="mapa-recinto" id="mapa-recinto">

        <svg class="caminhos"
             viewBox="0 0 100 100"
             preserveAspectRatio="none">

            <path class="ruas"
                  d="M 12 85 H 85
                     M 45 15 V 90
                     M 15 45 H 85">
            </path>

            <polyline class="rota"
                      id="linha-rota"
                      points="">
            </polyline>

        </svg>

        <!-- Palcos criados pelo JavaScript -->
        <div id="marcadores"></div>

        <!-- Posição simulada do utilizador -->
        <span class="marcador origem"
              id="origem"
              title="Tu">
        </span>

        <!-- Entrada do recinto -->
        <span class="marcador entrada"
              id="local-entrada">
            Entrada
        </span>

        <!-- Ponto escolhido no mapa -->
        <span class="marcador personalizado"
              id="ponto-personalizado"
              hidden>
            📍
        </span>

    </div>

    <p class="legenda">
        Azul: posição simulada.
        Verde: percurso ilustrativo.
        Toca no mapa para escolher um ponto personalizado.
    </p>

    <div class="info">
        <strong data-ponto-nome></strong>
        <span>Destino selecionado</span>
    </div>

    <button class="botao secundario"
            id="confirmar-ponto"
            type="button">
        Confirmar ponto
    </button>

    <p id="mensagem-confirmacao"></p>

    <a class="botao"
       id="ir-ar"
       data-link="mapaAR.html"
       href="mapaAR.html">
        Iniciar navegação AR →
    </a>

</main>

<script src="../../scripts/luisa-mapa/mapa.js"></script>
<script src="../../scripts/luisa-mapa/mapa2d.js"></script>

</body>
</html>
