
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BANDy - Mapa 2D</title>

    <link rel="stylesheet"
          href="../../styles/luisa-mapa/mapa.css">
</head>

<body>

<main class="pagina">

    <!-- Cabeçalho -->
    <header class="topo">

        <a href="mapa.html"
           id="voltar-mapa"
           aria-label="Voltar">←</a>

        <div>
            <span class="subtitulo">BANDy · Navegação</span>
            <h1>Mapa 2D</h1>
        </div>

    </header>


    <!-- Festival selecionado -->
    <div class="cabecalho-mapa">

        <strong data-festival-nome>NOS Alive</strong>

        <span class="etiqueta">
            Recinto ilustrativo
        </span>

    </div>


    <!-- Seleção independente -->
    <!-- Escondida quando o percurso vem do Chat -->
    <section class="seletores-mapa"
             id="painel-escolha">

        <div>
            <label for="festival">Festival</label>

            <select id="festival">
                <option value="alive">NOS Alive</option>
                <option value="kalorama">MEO Kalorama</option>
                <option value="primavera">Primavera Sound</option>
            </select>
        </div>

        <div>
            <label for="ponto">Destino</label>

            <select id="ponto">
                <option value="palco-x">Palco X</option>
                <option value="side-stage">Side Stage</option>
                <option value="palco-y">Palco Y</option>
                <option value="palco-z">Palco Z</option>
                <option value="livre">Personalizado</option>
            </select>
        </div>

    </section>


    <!-- MAPA DO RECINTO -->
    <section class="cartao-mapa">

        <div class="mapa-recinto"
             id="mapa-recinto"
             aria-label="Mapa ilustrativo do festival">

            <svg class="caminhos"
                 viewBox="0 0 100 100"
                 preserveAspectRatio="none"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- ========================= -->
                <!-- NOS ALIVE -->
                <!-- ========================= -->

                <g class="cenario cenario-alive">

                    <!-- Zonas verdes -->
                    <circle class="arvore" cx="8" cy="12" r="5"/>
                    <circle class="arvore" cx="91" cy="11" r="5"/>
                    <circle class="arvore" cx="12" cy="70" r="5"/>
                    <circle class="arvore" cx="89" cy="90" r="5"/>

                    <!-- Zona de descanso -->
                    <rect class="zona"
                          x="59" y="79"
                          width="28" height="10" rx="3"/>

                    <text class="texto-zona"
                          x="73" y="85"
                          text-anchor="middle">
                        Descanso
                    </text>

                </g>

                <!-- Caminhos do NOS Alive -->
                <g class="trilhos trilhos-alive">
                    <path d="
                        M 12 85 H 45
                        M 45 85 V 20
                        M 20 20 H 80
                        M 35 55 H 45
                        M 45 65 H 75
                    "/>
                </g>

                <g class="cenario cenario-alive">

                    <!-- Bar -->
                    <rect class="edificio"
                          x="79" y="35"
                          width="15" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="86.5" y="40.7"
                          text-anchor="middle">Bar</text>

                    <!-- WC -->
                    <rect class="edificio"
                          x="7" y="48"
                          width="15" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="14.5" y="53.7"
                          text-anchor="middle">WC</text>

                    <!-- Comida -->
                    <rect class="edificio"
                          x="75" y="70"
                          width="19" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="84.5" y="75.7"
                          text-anchor="middle">Comida</text>

                </g>


                <!-- ========================= -->
                <!-- MEO KALORAMA -->
                <!-- ========================= -->

                <g class="cenario cenario-kalorama">

                    <circle class="arvore" cx="10" cy="12" r="7"/>
                    <circle class="arvore" cx="41" cy="12" r="6"/>
                    <circle class="arvore" cx="91" cy="36" r="6"/>
                    <circle class="arvore" cx="9" cy="87" r="6"/>
                    <circle class="arvore" cx="87" cy="91" r="5"/>

                    <rect class="zona"
                          x="37" y="17"
                          width="24" height="11" rx="3"/>
                    <text class="texto-zona"
                          x="49" y="23.5"
                          text-anchor="middle">Jardim</text>

                </g>

                <!-- Caminhos do Kalorama -->
                <g class="trilhos trilhos-kalorama">
                    <path d="
                        M 50 90 V 52
                        M 20 52 H 75
                        M 20 30 V 52
                        M 25 52 V 65
                        M 75 18 V 70
                    "/>
                </g>

                <g class="cenario cenario-kalorama">

                    <rect class="edificio"
                          x="55" y="34"
                          width="17" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="63.5" y="39.7"
                          text-anchor="middle">Bar</text>

                    <rect class="edificio"
                          x="6" y="68"
                          width="15" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="13.5" y="73.7"
                          text-anchor="middle">WC</text>

                    <rect class="edificio"
                          x="61" y="82"
                          width="24" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="73" y="87.7"
                          text-anchor="middle">Comida</text>

                </g>


                <!-- ========================= -->
                <!-- PRIMAVERA SOUND -->
                <!-- ========================= -->

                <g class="cenario cenario-primavera">

                    <circle class="arvore" cx="9" cy="12" r="5"/>
                    <circle class="arvore" cx="86" cy="12" r="6"/>
                    <circle class="arvore" cx="11" cy="82" r="5"/>
                    <circle class="arvore" cx="91" cy="57" r="5"/>

                    <rect class="zona"
                          x="8" y="86"
                          width="26" height="9" rx="3"/>
                    <text class="texto-zona"
                          x="21" y="91.5"
                          text-anchor="middle">Descanso</text>

                </g>

                <!-- Caminhos do Primavera Sound -->
                <g class="trilhos trilhos-primavera">
                    <path d="
                        M 85 85 H 45
                        M 45 90 V 20
                        M 18 65 H 45
                        M 45 20 H 70
                        M 25 25 H 45
                        M 45 60 H 65
                    "/>
                </g>

                <g class="cenario cenario-primavera">

                    <rect class="edificio"
                          x="76" y="36"
                          width="17" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="84.5" y="41.7"
                          text-anchor="middle">Bar</text>

                    <rect class="edificio"
                          x="5" y="43"
                          width="17" height="9" rx="2"/>
                    <text class="texto-edificio"
                          x="13.5" y="48.7"
                          text-anchor="middle">WC</text>

                    <rect class="edificio"
                          x="51" y="90"
                          width="24" height="8" rx="2"/>
                    <text class="texto-edificio"
                          x="63" y="95.5"
                          text-anchor="middle">Comida</text>

                </g>


                <!-- Percurso selecionado -->
                <polyline id="linha-rota"
                          class="rota"
                          points=""/>

            </svg>


            <!-- Palcos adicionados pelo JS -->
            <div id="marcadores"></div>


            <!-- Localização simulada -->
            <span class="marcador origem"
                  id="origem"
                  title="A tua localização">
            </span>


            <!-- Entrada fixa -->
            <span class="marcador entrada"
                  id="local-entrada">
                Entrada
            </span>


            <!-- Ponto personalizado -->
            <span class="marcador personalizado"
                  id="ponto-personalizado"
                  hidden>
                📍
            </span>

        </div>


        <!-- Legenda -->
        <div class="legenda-mapa">

            <span>
                <i class="legenda-cor cor-tu"></i>
                Tu
            </span>

            <span>
                <i class="legenda-cor cor-rota"></i>
                Percurso
            </span>

            <span>
                <i class="legenda-cor cor-palco"></i>
                Palcos
            </span>

        </div>

    </section>


    <!-- Destino -->
    <section class="destino-info">

        <div>
            <span class="titulo-pequeno">
                DESTINO SELECIONADO
            </span>

            <strong data-ponto-nome>
                Palco X
            </strong>
        </div>

        <span class="destino-icone">📍</span>

    </section>


    <!-- Instrução -->
    <p class="ajuda-mapa"
       id="ajuda-mapa">
        Seleciona um palco ou toca no mapa
        para criar um ponto personalizado.
    </p>


    <!-- Confirmar -->
    <button type="button"
            class="botao secundario"
            id="confirmar-ponto">
        Confirmar ponto
    </button>

    <p id="mensagem-confirmacao"
       aria-live="polite"></p>


    <!-- Ir para AR -->
    <a href="mapaAR.html"
       class="botao"
       id="ir-ar"
       data-link="mapaAR.html">
        Iniciar navegação AR →
    </a>

</main>


<script src="../../scripts/luisa-mapa/mapa.js"></script>
<script src="../../scripts/luisa-mapa/mapa2d.js"></script>

</body>
</html>
